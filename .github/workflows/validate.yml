name: Validate synthetic portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check synthetic examples and code
        run: python -m pytest -q
      - name: Check proposed publication files
        run: python tools/check_publication_safety.py .
      - name: Run read-only synthetic demo
        run: python -m vrp_report_curation --roots examples/corpus --tickets examples/tickets.synthetic.json --dry-run
