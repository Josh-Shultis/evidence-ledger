name: Validate synthetic portfolio

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check synthetic examples and code
        run: python -m pytest -q
      - name: Check proposed publication files
        run: python tools/check_publication_safety.py .
      - name: Run read-only synthetic demo
        run: python -m vrp_report_curation --roots examples/corpus --tickets examples/tickets.synthetic.json --dry-run
