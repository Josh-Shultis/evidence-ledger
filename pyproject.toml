[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrp-report-curation"
version = "0.1.0"
description = "Local, reviewer-safe report and evidence curator"
requires-python = ">=3.11"
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vrp-curate = "vrp_report_curation.curator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
